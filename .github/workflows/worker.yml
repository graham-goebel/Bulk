name: Deploy Worker to Cloudflare

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      APP_PASSCODE: ${{ secrets.APP_PASSCODE }}
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the Worker from GitHub. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Check syntax
        if: steps.check.outputs.ready == 'true'
        run: node --check worker/src/index.js

      - name: Install Wrangler
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npx wrangler deploy

      # Only secrets that are set get uploaded, so ones already set with
      # `wrangler secret put` or the Cloudflare dashboard are left alone.
      - name: Upload Worker secrets
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          for name in NOTION_TOKEN APP_PASSCODE; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | npx wrangler secret put "$name"
            else
              echo "$name not set in GitHub secrets; leaving the Worker's value alone."
            fi
          done
